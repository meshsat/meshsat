# MeshSat Community Post: DHCP and a catch-all DNS on the post's own
# interface only. Template; meshsat-post-net renders it to
# /run/meshsat-post/dnsmasq.conf. Nothing here listens on wlan0. [MESHSAT-1733]
interface=@IFACE@
bind-interfaces
except-interface=lo
listen-address=@ADDR@
# No upstream: every name answers with the post's address, so the first page
# a phone opens is the portal. No IPv6 answers at all.
no-resolv
no-hosts
no-poll
address=/#/@ADDR@
# DHCP: a /24 for the phones, two-hour leases, the post as router and DNS.
dhcp-range=@DHCP_FROM@,@DHCP_TO@,255.255.255.0,2h
dhcp-option=option:router,@ADDR@
dhcp-option=option:dns-server,@ADDR@
# RFC 8910: where the captive portal API is (RFC 8908 JSON).
dhcp-option=114,http://@ADDR@/.well-known/captive-portal
dhcp-authoritative
dhcp-leasefile=/run/meshsat-post/leases
# Router advertisements stay off (the default); this network has no IPv6.
