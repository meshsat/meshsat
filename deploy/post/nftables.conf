# MeshSat Community Post: what the post's interface may do, and nothing
# else. Template; meshsat-post-net renders it to /run/meshsat-post/nftables.conf
# and meshsat-post-fw loads it as its own table, beside Docker's rules, never
# in them. Every rule names the post's interface: wlan0 and the rest of the
# kit are not touched. [MESHSAT-1733]
table inet meshsat_post {
	chain input {
		type filter hook input priority 0; policy accept;
		# Phones on the post reach DHCP, DNS and the portal (80, sent to the
		# Bridge's portal listener below) and nothing else on this kit.
		iifname "@IFACE@" ct state established,related accept
		iifname "@IFACE@" udp dport { 53, 67 } accept
		iifname "@IFACE@" tcp dport { 53, 80 } accept
		iifname "@IFACE@" ip daddr @BACKEND_IP@ tcp dport @BACKEND_PORT@ accept
		iifname "@IFACE@" icmp type echo-request accept
		iifname "@IFACE@" drop
	}
	chain forward {
		type filter hook forward priority 0; policy accept;
		# Nothing is forwarded to or from the post: no internet, no LAN.
		iifname "@IFACE@" drop
		oifname "@IFACE@" drop
	}
	chain prerouting {
		type nat hook prerouting priority -100; policy accept;
		# Port 80 on the post's address is the Bridge's portal listener,
		# published on the host's loopback only (route_localnet is set on
		# the interface by meshsat-post-net for this).
		iifname "@IFACE@" tcp dport 80 dnat ip to @BACKEND@
	}
}
