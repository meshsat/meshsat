# MeshSat Community Post: the open access point on the USB WiFi dongle.
# Template. meshsat-post-net renders it to /run/meshsat-post/hostapd.conf
# with the values from /etc/default/meshsat-post; hostapd never reads this
# file directly. The kit's own wlan0 (the management path) is never named
# here and never touched. [MESHSAT-1733]
interface=@IFACE@
driver=nl80211
ssid=@SSID@
# 2.4 GHz: every phone has it, and the dongle's 5 GHz would need DFS.
hw_mode=g
channel=@CHANNEL@
country_code=@COUNTRY@
ieee80211d=1
ieee80211n=1
wmm_enabled=1
# An open network: no key, as a captive portal must be to be found.
auth_algs=1
ignore_broadcast_ssid=0
# Phones on the post never see each other; the post is a front door, not a LAN.
ap_isolate=1
max_num_sta=40
ctrl_interface=/run/meshsat-post/hostapd
ctrl_interface_group=0
