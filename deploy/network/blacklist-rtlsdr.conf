# MeshSat field kit: keep the kernel DVB stack off the RTL-SDR dongle.
# The spectrum monitor drives the dongle from user space (librtlsdr via
# rtl_power_fftw); with dvb_usb_rtl28xxu bound, every scan has to detach the
# kernel driver first and the two race (usb_claim_interface error -6, seven
# times fewer samples on tesseract than on parallax, 5 Sep 2026). [MESHSAT-808]
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist r820t
