# Disable firmware roaming offload on the Pi's onboard radio (BCM4345/6).
#
# The Broadcom firmware makes its own roaming decisions. Where several access
# points share one SSID at similar signal - a mesh or extender setup, which is
# the normal case in a home or a field site - its heuristics re-trigger
# constantly and the kit leaves the network every minute or two. Measured on
# parallax 2026-09-01: 47 disconnects in 90 minutes before, 1 after.
#
# With roamoff=1 the decision belongs to wpa_supplicant, which is far stickier.
# SSID and credentials are untouched, so the worst case is clinging to a weaker
# AP for longer - never a failure to associate. [MESHSAT WiFi reliability]
options brcmfmac roamoff=1
