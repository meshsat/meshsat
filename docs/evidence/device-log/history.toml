# What the field kits could not record about their own devices, from the
# project's notes (SIDN fonds project 261042, deliverable D4).
#
# scripts/device-log/export.py reads this file next to the kits' signed
# audit logs. Times are UTC. Kits: tesseract, parallax or both.
#
# [[inventory]]  a device taken out of a kit, or put back, before the kit
#                could record it itself (13 November 2026).
# [[answer]]     what cleared one of the automatic wedges, and whether the
#                case had to be opened, where the notes say so.
# [[incident]]   a wedge before automatic logging began (5 September 2026),
#                or on a device the watchdog does not watch.

# -------------------------------------------------------------------- rules

[rules]
# Off since 13 November 2026 (afternoon). The first export read every
# PicoAPRS silence whose end the kit did not log as cleared by a PTT press
# with the case opened. The owner pressed the PTT button 2 or 3 times between
# September and 13 November, so that reading over-counted: those silences now
# show "end not logged". A press is still the case opened.
picoaprs_silence_cleared_by_ptt = false

# Corrections to an export already published, printed at the top of every
# later export.
[[correction]]
date = "2026-11-13"
text = "The first export of 13 November 2026 counted 65 PicoAPRS receive silences as cleared by hand with a press of the radio's PTT button, the case opened. The kits logged when each silence began, not how it ended, and the PTT button was pressed 2 or 3 times in that period. Those silences now show \"end not logged\"; the totals for \"cleared by hand\" and \"case opened\" went down by the same number."

