# =============================================================================
# MeshSat Pipeline — Build, Package, Deploy
# =============================================================================
# Builds Go binary, builds multi-arch Docker image, pushes to GHCR,
# and deploys to Pi via SSH.
# =============================================================================

stages:
  - validate
  - build
  - package
  - deploy
  - pages

variables:
  MESHSAT_IMAGE: "ghcr.io/meshsat/meshsat"
  BUILDER_IMAGE: "ghcr.io/cubeos-app/api-builder:latest"

# -----------------------------------------------------------------------------
# CONSISTENCY CHECK — CubeOS critical rules gate
# -----------------------------------------------------------------------------
lint:consistency:
  stage: validate
  image: alpine:latest
  tags: [multiarch]
  variables:
    GIT_DEPTH: 50
  before_script:
    - apk add --no-cache git bash
  script:
    - |
      bash <<'CONSISTENCY_CHECK'
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        DIFF=$(git diff HEAD~1 HEAD -- . ':!.gitlab-ci.yml' 2>/dev/null || echo "")
      else
        git fetch origin main --depth=50 2>/dev/null || true
        DIFF=$(git diff origin/main...HEAD -- . ':!.gitlab-ci.yml' 2>/dev/null || git diff HEAD~1 HEAD -- . ':!.gitlab-ci.yml' 2>/dev/null || echo "")
      fi

      # Filter out the consistency check script's own lines to prevent false positives
      DIFF=$(echo "$DIFF" | grep -v 'VIOLATIONS+=\|WARNINGS+=\|CONSISTENCY_CHECK\|grep.*-[cq]E' || echo "$DIFF")

      if [ -z "$DIFF" ]; then
        echo "No diff to check. Skipping."
        exit 0
      fi

      REPO_NAME="meshsat"
      VIOLATIONS=()
      WARNINGS=()

      # Standalone-mode pragma: field kits run meshsat as the sole
      # trusted container on a dedicated Pi; there is no HAL container
      # to go through, so the HAL-boundary rule is scoped off when the
      # diff explicitly opts in. The pragma `// host-ops: allowed-in-standalone`
      # must appear on any added line in the same commit.
      SKIP_HAL_BOUNDARY=""
      if echo "$DIFF" | grep -qE '^\+.*host-ops: allowed-in-standalone'; then
        SKIP_HAL_BOUNDARY=1
        echo "consistency-check: HAL-boundary rule skipped — standalone-mode pragma detected"
      fi

      # Rule 1: HAL boundary (skippable via pragma above)
      if [ -z "$SKIP_HAL_BOUNDARY" ]; then
        if echo "$DIFF" | grep -qE '^\+.*\bnsenter\b'; then
          VIOLATIONS+=("HAL boundary: nsenter found — all host ops must go through HAL")
        fi
        if echo "$DIFF" | grep -qE '^\+.*exec\.Command.*systemctl'; then
          VIOLATIONS+=("HAL boundary: direct systemctl call — use HAL REST endpoint")
        fi
      fi

      # Rule 2: CGO
      if echo "$DIFF" | grep -qE '^\+.*import "C"'; then
        VIOLATIONS+=("CGO: import C found — all Go must compile with CGO_ENABLED=0")
      fi

      # Rule 3: docker run
      if echo "$DIFF" | grep -E '^\+\s*docker run ' | grep -qvE '(#|comment)'; then
        VIOLATIONS+=("Orchestration: docker run found — use docker stack deploy")
      fi

      # Rule 4: Swagger annotations on new handlers
      NEW_HANDLERS=$(echo "$DIFF" | grep -cE '^\+func [A-Z][a-zA-Z]*(Handler|Handle|Endpoint)\(' || true)
      NEW_SWAGGER=$(echo "$DIFF" | grep -cE '^\+.*@Summary' || true)
      if [ "$NEW_HANDLERS" -gt 0 ] && [ "$NEW_SWAGGER" -eq 0 ]; then
        WARNINGS+=("Swagger: $NEW_HANDLERS new handler(s) with no @Summary annotation")
      fi

      # Rule 5: Migration edits (append-only)
      # Extract only the migrations.go hunk from the diff, then check for removed SQL lines.
      # Previous version checked the entire diff, causing false positives when queries.go
      # had removed SQL lines in the same commit as a new migration.
      if echo "$DIFF" | grep -qE '^--- .*migrations\.go'; then
        MIG_DIFF=$(echo "$DIFF" | sed -n '/^diff.*migrations\.go/,/^diff --git/p')
        EDITED=$(echo "$MIG_DIFF" | grep -cE '^\-[^-].*(CREATE TABLE|ALTER TABLE|INSERT INTO|UPDATE .* SET)' || true)
        if [ "$EDITED" -gt 0 ]; then
          VIOLATIONS+=("Database: existing migration modified — migrations are append-only")
        fi
      fi

      # Rule 6: Pi-hole deprecated CLI
      if echo "$DIFF" | grep -qE '^\+.*(pihole -a|pihole --|pihole reloaddns|docker exec.*pihole.*--config)'; then
        VIOLATIONS+=("Pi-hole: deprecated CLI — use v6 REST API at port 6001")
      fi

      # Rule 7: YouTrack issue ID
      if ! echo "$CI_COMMIT_MESSAGE" | grep -qE '\[(CUBEOS|MESHSAT)-[0-9]+\]'; then
        if ! echo "$CI_COMMIT_MESSAGE" | grep -qE '^chore: bump version'; then
          WARNINGS+=("Traceability: commit has no [MESHSAT-XX] or [CUBEOS-XX] reference")
        fi
      fi

      echo ""
      echo "=== Consistency Check: $REPO_NAME ==="
      if [ ${#VIOLATIONS[@]} -gt 0 ]; then
        echo "VIOLATIONS (pipeline blocked):"
        for v in "${VIOLATIONS[@]}"; do echo "  [BLOCK] $v"; done
      fi
      if [ ${#WARNINGS[@]} -gt 0 ]; then
        echo "WARNINGS (review recommended):"
        for w in "${WARNINGS[@]}"; do echo "  [WARN]  $w"; done
      fi
      if [ ${#VIOLATIONS[@]} -eq 0 ] && [ ${#WARNINGS[@]} -eq 0 ]; then
        echo "  All checks passed."
      fi
      echo ""
      if [ ${#VIOLATIONS[@]} -gt 0 ]; then
        echo "FAILED: ${#VIOLATIONS[@]} violation(s). Fix before merging."
        exit 1
      fi
      echo "PASSED"
      CONSISTENCY_CHECK
  rules:
    - when: always
  allow_failure: false

# -----------------------------------------------------------------------------
# TEST:AGENT — Host agent unit tests (gate: the deploy installs this file)
# -----------------------------------------------------------------------------
# The OOB host agent is a host file, not part of the container image, so the Go
# suite never sees it. Since the deploy stage now installs it on the kits, its
# own tests gate the deploy too. Stdlib Python only, no root, nothing on the
# runner is read or switched. [MESHSAT-821]
test:agent:
  stage: validate
  tags: [multiarch]
  image: alpine:latest
  before_script:
    - apk add --no-cache python3
  script:
    - cd deploy/oob && python3 -m unittest test_agent -v
    # The receipt printer service is a host file too (deploy/printer); its slips
    # for the Community Post are checked against a fake printer. [MESHSAT-1733]
    - cd "$CI_PROJECT_DIR/deploy/printer" && python3 -m unittest test_receipt_printer -v
    - cd "$CI_PROJECT_DIR/cmd/jspr-helper" && python3 -m unittest test_jspr_helper test_imt_helper_ownership -v
  rules:
    - when: always

# -----------------------------------------------------------------------------
# TEST:WEB — the compose view and the delivery status card in jsdom (vitest):
# the real components, store and API client; only HTTP answers, timers and
# confirm() are controlled. A failure blocks the deploy. [MESHSAT-1584]
# -----------------------------------------------------------------------------
test:web:
  stage: validate
  tags: [multiarch]
  image: node:22-alpine
  script:
    - cd web
    - npm ci --no-audit --no-fund
    - npm test
    # The same build the image ships (Dockerfile web stage: node:22-alpine,
    # npm ci, npm run build), handed to test:a11y. [MESHSAT-1843]
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 week
  rules:
    - when: always

# -----------------------------------------------------------------------------
# TEST:A11Y — SIDN deliverable D5: WCAG 2.1 AA on Dashboard, Messages (with
# Inbox and Compose), Map and Settings. Headless Chromium loads the built app
# from disk with synthetic API answers (test/a11y/fixtures, no server, no
# network), runs axe-core on 249 states in three shells (three at a time) and counts form
# controls with no label. Any count above test/a11y/baseline.json fails, and so
# does the canary (known defects injected into the app must be found). Unit
# tests of the ratchet run first. Reports: a11y-results/. [MESHSAT-1843]
# -----------------------------------------------------------------------------
test:a11y:
  stage: validate
  tags: [multiarch]
  # Must match the playwright version pinned in test/a11y/package.json.
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  needs:
    - job: test:web
      artifacts: true
  timeout: 30m
  script:
    - npm ci --prefix test/a11y --no-audit --no-fund --ignore-scripts
    - node --test test/a11y/ratchet.test.mjs test/a11y/fixtures.test.mjs
    - node test/a11y/run.mjs --dist web/dist --out a11y-results
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - a11y-results/
    reports:
      junit: a11y-results/junit.xml
  # A hard gate since pipeline 64332 matched the local run state for state.
  allow_failure: false
  rules:
    - when: always

# -----------------------------------------------------------------------------
# TEST — Run Go test suite (gate: regressions block deploy)
# -----------------------------------------------------------------------------
test:
  stage: validate
  tags: [multiarch]
  # The Go of go.mod's toolchain line, named here rather than left to the
  # builder image: govulncheck judges the standard library of the Go that
  # builds, and Go 1.24 had been out of security support since February
  # 2026 when it was found on 13 Nov 2026. [MESHSAT-1137]
  image: golang:1.26-bookworm
  script:
    - cd ${CI_PROJECT_DIR}
    - go mod download
    # Per-package timeout. 900s headroom lets internal/api and
    # internal/engine finish under runner contention (three concurrent
    # pipelines can double their wall time). Historical green runs sit
    # at ~420–460s; 600s was too tight once three pipelines queued on
    # one runner. [MESHSAT-551]
    - go test -count=1 -timeout 900s ./...
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# SECURITY: secret and dependency scanning on every pipeline, every branch
# (SIDN fonds project 261042, deliverable D6; MESHSAT-1137). The owner's rule
# of 13 Nov 2026: a leaked secret or a Go vulnerability the code reaches stops
# the deploy; findings in the web app's packages and in the kit image show red
# and do not block.
# -----------------------------------------------------------------------------
security:gitleaks:
  stage: validate
  tags: [multiarch]
  image:
    name: zricethezav/gitleaks:v8.24.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: "50"
  script:
    # The working tree, then the last 25 commits. `.gitleaks.toml` allows only
    # the reviewed fixture files, each with its reason.
    - gitleaks dir . --no-banner --redact --exit-code 1
    - gitleaks git . --no-banner --redact --exit-code 1 --log-opts="-n 25"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

security:govulncheck:
  stage: validate
  tags: [multiarch]
  # The same Go as the build (go.mod toolchain): govulncheck reports the
  # standard library of the Go it runs on.
  image: golang:1.26-alpine
  before_script:
    # Pinned, bumped together with the Go image, deliberately (the Hub's
    # @latest broke every merge the day v1.8.0 came out, MESHSAT-712).
    - go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
  script:
    # Exits non-zero only for a vulnerability the code actually calls.
    - govulncheck ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

security:osv-web:
  stage: validate
  tags: [multiarch]
  image:
    name: ghcr.io/google/osv-scanner:v2.7.0
    entrypoint: [""]
  script:
    - /osv-scanner scan source --lockfile web/package-lock.json --lockfile test/a11y/package-lock.json
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# -----------------------------------------------------------------------------
# TEST:INTEROP — Reticulum wire compatibility against upstream Python RNS/LXMF
# (pinned in internal/interop/rnsenv). The venv is cached between pipelines.
# A required gate since 27 Oct 2026, after 82 green runs from 17 to 26 Oct.
# [MESHSAT-1348, MESHSAT-1714]
# -----------------------------------------------------------------------------
test:interop:
  stage: validate
  tags: [multiarch]
  image: golang:1.26-bookworm
  variables:
    MESHSAT_INTEROP: "1"
    MESHSAT_RNS_VENV: "${CI_PROJECT_DIR}/.cache/rns-venv"
  cache:
    key: rns-venv-1.5.7
    paths:
      - .cache/rns-venv
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip > /dev/null
  script:
    - cd ${CI_PROJECT_DIR}
    - go mod download
    - make interop
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# BUILD — Compile Go binary for ARM64 + AMD64
# -----------------------------------------------------------------------------
build:
  stage: build
  tags: [multiarch]
  image: golang:1.26-bookworm
  script:
    - cd ${CI_PROJECT_DIR}
    - go mod download

    - echo "Building ARM64 binary..."
    - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o meshsat-arm64 ./cmd/meshsat/

    - echo "Building AMD64 binary..."
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o meshsat-amd64 ./cmd/meshsat/

    - ls -lh meshsat-arm64 meshsat-amd64
  artifacts:
    paths:
      - meshsat-arm64
      - meshsat-amd64
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# PACKAGE — Build multi-arch Docker image and push to GHCR
# -----------------------------------------------------------------------------
package:
  stage: package
  tags: [multiarch]
  image: docker:27
  needs:
    - job: build
      artifacts: true
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    # One builder per job. With a shared name, two pipelines packaging at
    # once shared one BuildKit container, and the first job's after_script
    # removed it from under the second, which failed with "failed to receive
    # status ... graceful_stop" (pipelines 55540 and 55541, 21 Sep 2026).
    # [MESHSAT-849]
    - docker buildx create --name meshsatbuilder-${CI_JOB_ID} --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build --no-cache \
        --platform linux/amd64,linux/arm64 \
        --push \
        --metadata-file buildx-metadata.json \
        -t ${MESHSAT_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        -t ${MESHSAT_IMAGE}:latest \
        .
      echo "Pushed multi-arch ${MESHSAT_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - |
      # Hand the manifest digest to the deploy stage so each kit can prove it is
      # running THIS build and not a cached older one. Without it a pull timeout
      # silently deploys yesterday's image and the job still goes green.
      # [MESHSAT-809]
      #
      # The digest comes from buildx's own metadata file, which records what it
      # just pushed. Do NOT go back to `imagetools inspect --format`: the buildx
      # bundled with docker:27 ignores the template and prints the whole
      # human-readable manifest listing, which produced a multi-line dotenv and
      # failed the artifact upload with "Invalid Format" (pipeline 53497).
      MESHSAT_EXPECTED_DIGEST=$(grep -o '"containerimage.digest"[[:space:]]*:[[:space:]]*"sha256:[0-9a-f]*"' buildx-metadata.json | grep -o 'sha256:[0-9a-f]*' | head -1)
      case "$MESHSAT_EXPECTED_DIGEST" in
        sha256:????????????????????????????????????????????????????????????????) ;;
        *)
          echo "ERROR: no usable manifest digest in buildx-metadata.json:"
          cat buildx-metadata.json
          exit 1
          ;;
      esac
      echo "Manifest digest: ${MESHSAT_EXPECTED_DIGEST}"
      {
        echo "MESHSAT_EXPECTED_DIGEST=${MESHSAT_EXPECTED_DIGEST}"
        echo "MESHSAT_EXPECTED_SHA=${CI_COMMIT_SHORT_SHA}"
      } > package.env
      echo "--- package.env ---"
      cat package.env
  artifacts:
    reports:
      dotenv: package.env
  after_script:
    - docker buildx rm meshsatbuilder-${CI_JOB_ID} || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# SECURITY:TRIVY — known CVEs in the kit image just pushed (MESHSAT-1137).
# Reports and shows red; does not block the deploy (owner, 13 Nov 2026): the
# Debian base and the bundled tools carry CVEs we cannot fix ourselves.
# -----------------------------------------------------------------------------
security:trivy:
  stage: package
  tags: [multiarch]
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  needs:
    - job: package
      artifacts: false
  timeout: 30m
  variables:
    TRIVY_USERNAME: $GHCR_USER
    TRIVY_PASSWORD: $GHCR_TOKEN
    TRIVY_CACHE_DIR: .trivycache
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - IMAGE="${MESHSAT_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - trivy image --scanners vuln --quiet --format table --severity CRITICAL,HIGH "$IMAGE" || true
    - trivy image --scanners vuln --quiet --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 "$IMAGE"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# PACKAGE:DEMO — the public demo (cmd/meshsat-demo, Dockerfile.demo): the same
# web app as the kits, in a static non-root binary with no Bridge API. amd64
# only (the notrf01 cluster); tagged demo-<sha> in the Bridge's own public
# package. It reaches no kit: bump_demo_pin pins it for Argo CD. [MESHSAT-1845]
# -----------------------------------------------------------------------------
package:demo:
  stage: package
  tags: [multiarch]
  image: docker:27
  needs:
    - job: build
      artifacts: false
    - job: test
      artifacts: false
    - job: test:a11y
      artifacts: false
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    - docker buildx create --name meshsatdemo-${CI_JOB_ID} --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build --no-cache \
        --platform linux/amd64 \
        --push \
        --metadata-file demo-metadata.json \
        -f Dockerfile.demo \
        -t ${MESHSAT_IMAGE}:demo-${CI_COMMIT_SHORT_SHA} \
        -t ${MESHSAT_IMAGE}:demo \
        .
    - |
      DEMO_DIGEST=$(grep -o '"containerimage.digest"[[:space:]]*:[[:space:]]*"sha256:[0-9a-f]*"' demo-metadata.json | grep -o 'sha256:[0-9a-f]*' | head -1)
      case "$DEMO_DIGEST" in
        sha256:????????????????????????????????????????????????????????????????) ;;
        *) echo "ERROR: no usable digest in demo-metadata.json"; cat demo-metadata.json; exit 1 ;;
      esac
      echo "DEMO_DIGEST=${DEMO_DIGEST}" > demo.env
      cat demo.env
  artifacts:
    reports:
      dotenv: demo.env
  after_script:
    - docker buildx rm meshsatdemo-${CI_JOB_ID} || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# BUMP_DEMO_PIN — write the demo's new digest into k8s/demo/kustomization.yaml
# as a [skip ci] commit (no pipeline, so no kit redeploy); Argo CD (Application
# meshsat-demo) rolls it out. A copy of the Hub's bump_k8s_pin with its two
# guards: never pin a build older than the pinned one (resource_group orders
# jobs, not commits; MESHSAT-1023), and `sed -n 1p`, never `head -1`, after
# git log under pipefail (exit 141; the Hub's 2026-09-11 lesson). The commit
# carries the owner's identity like every commit in this repo. [MESHSAT-1845]
# -----------------------------------------------------------------------------
bump_demo_pin:
  stage: deploy
  interruptible: false
  resource_group: demo-pin-bump
  tags: [multiarch]
  image: alpine:3.21
  needs:
    - job: package:demo
      artifacts: true
  variables:
    GIT_STRATEGY: none
    PIN_REMOTE: "git@nllei01gitlab01.nuclearlighters.net:products/meshsat/meshsat.git"
  before_script:
    - apk add --no-cache bash git openssh-client python3
  script:
    - |
      bash -euo pipefail -c '
      [ -n "${K8S_PIN_SSH_KEY:-}" ] || { echo "FATAL - K8S_PIN_SSH_KEY file variable not set on this project"; exit 1; }
      install -m 600 "$K8S_PIN_SSH_KEY" /tmp/pin_key
      export GIT_SSH_COMMAND="ssh -i /tmp/pin_key -o StrictHostKeyChecking=accept-new"
      git clone --depth 200 --branch main "$PIN_REMOTE" /tmp/pin-repo
      cd /tmp/pin-repo
      pinned=$(git log -100 --pretty=%b -- k8s/demo/kustomization.yaml \
               | sed -n "s|^Source: .*@\([0-9a-f]\{40\}\).*|\1|p" | sed -n 1p)
      if [ -n "$pinned" ] && [ "$pinned" != "$CI_COMMIT_SHA" ] \
         && git cat-file -e "${pinned}^{commit}" 2>/dev/null \
         && git merge-base --is-ancestor "$CI_COMMIT_SHA" "$pinned"; then
        echo "refusing to pin $CI_COMMIT_SHORT_SHA: it is an ANCESTOR of the already-pinned $pinned. Nothing to do."
        exit 0
      fi
      rc=0
      python3 scripts/k8s-bump-pin.py k8s/demo/kustomization.yaml "$MESHSAT_IMAGE" "$DEMO_DIGEST" \
        "demo-$CI_COMMIT_SHORT_SHA ($(date -u +%Y-%m-%d))" || rc=$?
      case "$rc" in 0) : ;; 3) echo "pin already current"; exit 0;; *) exit "$rc";; esac
      git -c user.name="Kyriakos Papadopoulos" -c user.email="ncpjfuzl@mxmx.email" \
        commit -am "[skip ci] chore(demo): pin the public demo to $CI_COMMIT_SHORT_SHA" \
        -m "Source: $CI_PROJECT_PATH@$CI_COMMIT_SHA (pipeline $CI_PIPELINE_ID)"
      for i in 1 2 3; do
        git push origin HEAD:main && exit 0
        git fetch origin main && git -c user.name="Kyriakos Papadopoulos" -c user.email="ncpjfuzl@mxmx.email" rebase origin/main
      done
      echo "FATAL: could not push the demo pin after 3 attempts"; exit 1
      '
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# DEPLOY — Pull latest image on each device and restart MeshSat (via SSH)
# Deploys to all configured devices in parallel using matrix strategy.
# Each device has a primary and one or more fallback addresses.
# CI variables required per device:
#   DEPLOY_ADDR_<TARGET>           — primary hostname/IP
#   DEPLOY_ADDR_ALT_<TARGET>       — fallback addresses, space separated (optional)
#   DEPLOY_USER_<TARGET>           — SSH user (optional, defaults to "cubeos")
# Field kits (parallax01, tesseract01) use DEPLOY_USER=kyriakosp, path /srv/meshsat.
# CubeOS devices use DEPLOY_USER=cubeos, path /cubeos/coreapps/meshsat/appconfig.
# ci-deploy.sh auto-detects the layout based on which compose file exists.
#
# A field kit has TWO names and the job walks them in order [MESHSAT-1182]:
#   nllei01<kit>01         the kit on the house network
#   nllei01<kit>01-field   the same kit behind the travel router, reached through a
#                          VPN tunnel — the path that carries a deploy at an event
# The travel router advertises the same SSID as the house, so which name answers
# depends on the access point the kit associated with, not on where the kit
# physically is. Always probe, never assume. The probe is an SSH login, not a ping:
# it proves the key works too. A candidate must also ANSWER WITH ITS OWN HOSTNAME
# before it is used, so a recycled address can never be handed a kit's deploy.
# Addresses live only in the CI variables; the operational detail is local-only.
# -----------------------------------------------------------------------------
deploy:
  stage: deploy
  tags: [multiarch]
  image: alpine:latest
  needs:
    - package
  parallel:
    matrix:
      - DEPLOY_TARGET: [parallax01, tesseract01]
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$CI_DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Resolve deploy addresses and SSH user from per-device CI variables
    - |
      UPPER_TARGET=$(echo "$DEPLOY_TARGET" | tr 'a-z' 'A-Z')
      eval "PRIMARY=\${DEPLOY_ADDR_${UPPER_TARGET}:-}"
      eval "ALT=\${DEPLOY_ADDR_ALT_${UPPER_TARGET}:-}"
      eval "DEPLOY_USER=\${DEPLOY_USER_${UPPER_TARGET}:-cubeos}"

      # $PRIMARY and $ALT are deliberately unquoted: ALT may hold several
      # space-separated candidates (name first, IP last) and word splitting is
      # what turns them into separate attempts. Do not quote them. [MESHSAT-1182]
      EXPECT_HOST="nllei01${DEPLOY_TARGET}"
      _RESOLVED=""
      _TRIED=""
      for ADDR in $PRIMARY $ALT; do
        if [ -z "$ADDR" ]; then continue; fi
        _TRIED="${_TRIED}${_TRIED:+ }${ADDR}"
        # -T 3: an unreachable candidate must not cost the keyscan's 5 s default
        # before the login below even starts.
        ssh-keyscan -T 3 -H "$ADDR" >> ~/.ssh/known_hosts 2>/dev/null || true
        # The job shell runs with -e and pipefail, so an unreachable candidate must
        # never be the exit status of a bare assignment: ssh exits 255 and the whole
        # job dies before the next address is tried. Keep the probe inside an `if`,
        # where -e is suppressed, and normalise afterwards. [MESHSAT-1182]
        # ConnectTimeout bounds the TCP connect only. A kit whose sshd answers the
        # banner and then stalls (seen from the runner on 2026-09-16) would hang the
        # probe until LoginGraceTime, so the whole login gets a hard ceiling too.
        if ! GOT_HOST=$(timeout 15 ssh -o ConnectTimeout=4 -o BatchMode=yes "${DEPLOY_USER}@${ADDR}" hostname 2>/dev/null); then
          echo "  ${ADDR}: no answer"
          continue
        fi
        GOT_HOST=$(printf '%s' "$GOT_HOST" | tr -d '\r\n' | tr 'A-Z' 'a-z')
        if [ -z "$GOT_HOST" ]; then
          echo "  ${ADDR}: connected but returned no hostname"
          continue
        fi
        if [ "$GOT_HOST" != "$EXPECT_HOST" ]; then
          echo "  ${ADDR}: answered as '${GOT_HOST}', expected '${EXPECT_HOST}' — skipping"
          continue
        fi
        _RESOLVED="$ADDR"
        break
      done
      if [ -z "$_RESOLVED" ]; then
        echo "ERROR: ${DEPLOY_TARGET} (${EXPECT_HOST}) answered on none of: ${_TRIED:-<no address configured>} — deploy FAILED"
        echo "       At the booth this means the WireGuard tunnel or the Mudi is down; at home,"
        echo "       that the kit is off. Check both names by hand before re-running:"
        echo "         ssh kyriakosp@${EXPECT_HOST} hostname ; ssh kyriakosp@${EXPECT_HOST}-field hostname"
        exit 1
      fi
      if [ "$_RESOLVED" = "$PRIMARY" ]; then
        _DEPLOY_PATH="primary address"
      else
        _DEPLOY_PATH="fallback address — the kit is away from the house network"
      fi
      export PI_DEPLOY_HOST="${DEPLOY_USER}@${_RESOLVED}"
      echo "Deploy target: ${DEPLOY_TARGET} → ${PI_DEPLOY_HOST} (${_DEPLOY_PATH})"
  script:
    - |
      if [ -z "${PI_DEPLOY_HOST:-}" ]; then
        echo "ERROR: device unreachable — deploy FAILED"
        exit 1
      fi
    - scp scripts/ci-deploy.sh ${PI_DEPLOY_HOST}:/tmp/ci-deploy-meshsat.sh
    # The OOB host agent lives on the host, not in the image, so nothing used
    # to carry it to a kit and it drifted from the repo. ci-deploy.sh installs
    # it when it differs, best effort. [MESHSAT-821]
    - scp deploy/oob/meshsat-oob-agent ${PI_DEPLOY_HOST}:/tmp/meshsat-oob-agent
    - |
      # MESHSAT_EXPECTED_* come from the package stage's dotenv report and let
      # the kit refuse to deploy a cached image that is not this build. A green
      # deploy previously proved only that /health answered. [MESHSAT-809]
      ssh -o ServerAliveInterval=15 ${PI_DEPLOY_HOST} \
        "GHCR_TOKEN='${GHCR_TOKEN}' GHCR_USER='${GHCR_USER}' DEPLOY_TARGET='${DEPLOY_TARGET}' MESHSAT_EXPECTED_DIGEST='${MESHSAT_EXPECTED_DIGEST}' MESHSAT_EXPECTED_SHA='${MESHSAT_EXPECTED_SHA}' MESHSAT_PULL_TIMEOUT_BASE='${MESHSAT_PULL_TIMEOUT_BASE}' bash /tmp/ci-deploy-meshsat.sh"
    - ssh ${PI_DEPLOY_HOST} "rm -f /tmp/ci-deploy-meshsat.sh /tmp/meshsat-oob-agent"
  after_script:
    - kill $SSH_AGENT_PID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true  # deploy failures don't block the pipeline but show as warnings
  environment:
    name: production/$DEPLOY_TARGET

# -----------------------------------------------------------------------------
# PAGES — Build Hugo documentation site and deploy to GitLab Pages
# -----------------------------------------------------------------------------
pages:
  stage: pages
  tags: [multiarch]
  image: alpine:latest
  before_script:
    - apk add --no-cache hugo git
  script:
    - cd docs/site
    - hugo --minify --baseURL "${CI_PAGES_URL}"
    - mv public ../../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docs/site/**/*

# =============================================================================
# SDD CI gate (Tier 4B) — appended 2026-05-18
# Validates spec/, STRIDE, observability, dispatch, outcomes against the
# canonical validator at the gateway repo's scripts/validate-project-spec.py.
# See the gateway repo's scripts/sdd-ci-snippet.yml for the canonical version.
# =============================================================================
sdd_validate_spec:
  stage: validate
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends git curl
    - pip install --quiet pyyaml
    - mkdir -p /opt/sdd/scripts
    # Pinned to an immutable commit rather than a moving feature-branch ref.
    # The branch this used to track (feat/sdd-tier1-validator-hardening on
    # project 30) can be renamed, deleted or force-pushed by unrelated work,
    # and this job blocks the validate stage — so a change in another
    # repository could stop deploys to the field kits. Pin, and fail open if
    # the validator cannot be fetched: a fetch failure means we could not
    # validate, not that validation failed. Genuine validation errors still
    # block, in `script:` below.
    - |
      SDD_VALIDATOR_REF=df93a44304e8a1657b4ea19c02980b9a9d74b96e
      for f in validate-project-spec.py cgc-drift-check.py; do
        if ! curl -fsSL \
            --retry 3 --retry-delay 2 --max-time 30 \
            "https://gitlab.nuclearlighters.net/api/v4/projects/30/repository/files/scripts%2F${f}/raw?ref=${SDD_VALIDATOR_REF}" \
            -o "/opt/sdd/scripts/${f}"; then
          echo "WARNING: could not fetch ${f} at ${SDD_VALIDATOR_REF} — skipping SDD validation."
          echo "SDD_SKIP=1" >> sdd.env
          exit 0
        fi
        chmod +x "/opt/sdd/scripts/${f}"
      done
    - |
      PARENT_SPEC_HOME=$(python3 -c "import json; pj=json.load(open(\"PROJECT.json\",encoding=\"utf-8\")); print(pj.get(\"parent_project\",{}).get(\"spec_home\",\"\") or \"\")" 2>/dev/null || echo "")
      if [ -n "$PARENT_SPEC_HOME" ] && [ ! -d "$PARENT_SPEC_HOME" ]; then
        echo "Cloning parent docs/ to $PARENT_SPEC_HOME for cross-parent checks..."
        mkdir -p "$(dirname "$PARENT_SPEC_HOME")"
        git clone --depth 1 https://gitlab.nuclearlighters.net/products/cubeos/docs.git "$PARENT_SPEC_HOME" 2>&1 | tail -3 || true
      fi
  script:
    # Explicit guard as well as the before_script exit: if the validator was
    # not fetched there is nothing to validate against, and that must not be
    # reported as a spec failure.
    - |
      if [ ! -x /opt/sdd/scripts/validate-project-spec.py ]; then
        echo "SDD validator unavailable — skipping (see fetch warning above)."
        exit 0
      fi
    - python3 /opt/sdd/scripts/validate-project-spec.py "$CI_PROJECT_DIR"
    - python3 /opt/sdd/scripts/cgc-drift-check.py "$CI_PROJECT_DIR" --max-age-days 90 || echo "CGC drift warnings (non-blocking)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - PROJECT.json
        - constitution.md
        - spec/**/*
        - steering/**/*
        - adr/**/*
        - dispatch/**/*
        - outcomes/**/*
  allow_failure: false

# -----------------------------------------------------------------------------
# CHANGELOG — tell meshsat.net to regenerate /changelog/ when a tag is cut
# [MESHSAT-853]. Downstream: meshsat-website job changelog:regenerate (source
# "pipeline", CHANGELOG_RUN=1); it commits the new section and deploys only
# when the pages changed. The nightly schedule there covers everything else.
# -----------------------------------------------------------------------------
changelog:notify-website:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  allow_failure: true
  variables:
    CHANGELOG_RUN: "1"
  trigger:
    project: products/meshsat/meshsat-website
    branch: main
