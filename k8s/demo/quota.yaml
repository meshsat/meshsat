# A ceiling for the whole namespace, so a fault (or a visitor who found one)
# cannot take more of the cluster than one small pod's worth.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: meshsat-demo
  namespace: meshsat-demo
spec:
  hard:
    pods: "3"
    requests.cpu: 300m
    requests.memory: 256Mi
    limits.cpu: "1"
    limits.memory: 768Mi
    services: "2"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "0"
    secrets: "4"
    configmaps: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: meshsat-demo
  namespace: meshsat-demo
spec:
  limits:
    - type: Container
      default: {cpu: 300m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {cpu: 500m, memory: 256Mi}
