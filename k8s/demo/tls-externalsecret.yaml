# *.meshsat.net for both Ingresses: the wildcard the NL cert-manager pushes to
# OpenBao (MESHSAT-865), read as the shop and the Hub read it.
# app.safertogether.eu is not served here by that name: the edge terminates its
# TLS with the safertogether.eu certificate and re-encrypts to the internal
# name post-demo.meshsat.net, which this wildcard covers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meshsat-net-tls
  namespace: meshsat-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: meshsat-net-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: crt
      remoteRef:
        key: k8s/shared/wildcard-meshsat-net-tls
        property: tls.crt
    - secretKey: key
      remoteRef:
        key: k8s/shared/wildcard-meshsat-net-tls
        property: tls.key
