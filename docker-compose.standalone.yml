# True standalone mode — direct serial, no HAL sidecar required.
# Usage: docker compose -f docker-compose.standalone.yml up --build
services:
  meshsat:
    build: .
    ports:
      - "6050:6050"
    privileged: true
    environment:
      - MESHSAT_MODE=direct
      - MESHSAT_PORT=6050
      - MESHSAT_DB_PATH=/data/meshsat.db
      # 9603 GPIO pins (MESHSAT-666/667/668). Default 0 = disabled.
      # On tesseract set MESHSAT_IRIDIUM_NETAV_PIN=22, _RI_PIN=23.
      # OnOff stays 0 until the MESHSAT-669 MOSFET buffer is installed.
      - MESHSAT_IRIDIUM_NETAV_PIN=${MESHSAT_IRIDIUM_NETAV_PIN:-0}
      - MESHSAT_IRIDIUM_RI_PIN=${MESHSAT_IRIDIUM_RI_PIN:-0}
      - MESHSAT_IRIDIUM_ONOFF_PIN=${MESHSAT_IRIDIUM_ONOFF_PIN:-0}
      - MESHSAT_IRIDIUM_ONOFF_ACTIVE_HIGH=${MESHSAT_IRIDIUM_ONOFF_ACTIVE_HIGH:-false}
      # DCF77 longwave time source (MESHSAT-673). Opt-in, off by default.
      # Parallax wiring as of 2026-04-23: DATA=BCM 21 (pin 40), PON=BCM 19 (pin 35).
      - MESHSAT_DCF77_ENABLED=${MESHSAT_DCF77_ENABLED:-false}
      - MESHSAT_DCF77_DATA_PIN=${MESHSAT_DCF77_DATA_PIN:-19}
      - MESHSAT_DCF77_PON_PIN=${MESHSAT_DCF77_PON_PIN:-21}
      - MESHSAT_DCF77_PON_ACTIVE_LOW=${MESHSAT_DCF77_PON_ACTIVE_LOW:-true}
      - MESHSAT_DCF77_PON_MANAGED=${MESHSAT_DCF77_PON_MANAGED:-}
      # Dynamic Reticulum interfaces (MESHSAT-1349/1350): first-boot seeds only,
      # Settings > Routing owns them afterwards. Empty = no instance seeded.
      - MESHSAT_RNODE_PORT=${MESHSAT_RNODE_PORT:-}
      - MESHSAT_RNODE_PRESET=${MESHSAT_RNODE_PRESET:-eu-868}
      - MESHSAT_RNODE_FLOW_CONTROL=${MESHSAT_RNODE_FLOW_CONTROL:-false}
      - MESHSAT_RNODE_ID_CALLSIGN=${MESHSAT_RNODE_ID_CALLSIGN:-}
      - MESHSAT_UDP_LISTEN=${MESHSAT_UDP_LISTEN:-}
      - MESHSAT_UDP_FORWARD=${MESHSAT_UDP_FORWARD:-}
      - MESHSAT_UDP_DEVICE=${MESHSAT_UDP_DEVICE:-}
      - MESHSAT_AUTO_IFACE_DEVICES=${MESHSAT_AUTO_IFACE_DEVICES:-}
      - MESHSAT_AUTO_IFACE_GROUP=${MESHSAT_AUTO_IFACE_GROUP:-reticulum}
      - MESHSAT_KISS_PORT=${MESHSAT_KISS_PORT:-}
      - MESHSAT_KISS_BAUD=${MESHSAT_KISS_BAUD:-115200}
      # CrossTalk IMT framing on iridium_imt_0 (MESHSAT-1351); Settings > Routing overrides.
      - MESHSAT_IMT_RNS_FRAMING=${MESHSAT_IMT_RNS_FRAMING:-false}
      # 10 m HF gateway (MESHSAT-1353): receive on the RTL-SDR (spectrum bands go
      # blind while on), transmit locked until an operator callsign is set.
      - MESHSAT_HF_RX_ENABLED=${MESHSAT_HF_RX_ENABLED:-false}
      - MESHSAT_HF_FREQ_HZ=${MESHSAT_HF_FREQ_HZ:-28124000}
      - MESHSAT_HF_TX_CALLSIGN=${MESHSAT_HF_TX_CALLSIGN:-}
      - MESHSAT_HF_TX_AUDIO_DEVICE=${MESHSAT_HF_TX_AUDIO_DEVICE:-}
      - MESHSAT_HF_TX_CAT_PORT=${MESHSAT_HF_TX_CAT_PORT:-}
    volumes:
      - meshsat-data:/data
      - /dev:/dev
      - /sys:/sys:ro
      # OOB management host agent socket directory (scripts/install-oob-agent.sh).
      # Mount the DIRECTORY, never the socket file. [MESHSAT-756]
      - /run/meshsat-oob:/run/meshsat-oob
    restart: unless-stopped

volumes:
  meshsat-data:
